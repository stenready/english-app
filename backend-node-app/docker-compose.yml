name: english-app

# Local development: `npm run db:up` starts PostgreSQL and the S3 storage (run the API with `npm run dev`).
# Production-like stack: `docker compose --profile app up --build` — PostgreSQL + migrations + API.
# Credentials below are for local development only.

x-database-url: &database-url postgresql://${POSTGRES_USER:-english}:${POSTGRES_PASSWORD:-english}@postgres:5432/${POSTGRES_DB:-english_app}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-english}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-english}
      POSTGRES_DB: ${POSTGRES_DB:-english_app}
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep data in a versioned subfolder of /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible file storage for local development (MinIO is no longer distributed as an image).
  # No credentials configured: every request is allowed, including public reads — local use only
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333']
    ports:
      - '8333:8333'
    volumes:
      - seaweedfs-data:/data

  # One-off: creates the bucket with public read (the app gives out direct file links), then exits.
  # Real providers: create the bucket and allow public read in their console
  create-bucket:
    image: amazon/aws-cli:2.27.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-dev}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    entrypoint: ['/bin/sh', '-c']
    # The S3 gateway needs a few seconds after start; head-bucket makes reruns a no-op
    command:
      - >
        until aws --endpoint-url http://seaweedfs:8333 s3api list-buckets > /dev/null 2>&1; do sleep 1; done;
        (aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket ${S3_BUCKET:-app-files} 2>/dev/null ||
        aws --endpoint-url http://seaweedfs:8333 s3 mb s3://${S3_BUCKET:-app-files}) &&
        aws --endpoint-url http://seaweedfs:8333 s3api put-bucket-policy --bucket ${S3_BUCKET:-app-files}
        --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::${S3_BUCKET:-app-files}/*"}]}'
    depends_on:
      - seaweedfs

  migrate:
    profiles: [app]
    build:
      context: .
      target: deps
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
      DATABASE_URL: *database-url
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  seaweedfs-data:
